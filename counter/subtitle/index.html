<!doctype html>
<!-- 字幕（tosu counter）：像视频字幕那样，在整个画面底部正中出一行字。由 TomoPet（osu-pet）拷进 tosu 的 static 文件夹，别手改（会被覆盖）。
     源文件：osu-pet 的 counter/subtitle/（照搬 SurfCore lib/osu/tosu-counter-subtitle/）。用法：OBS 加「浏览器」源，地址 http://127.0.0.1:24050/fatfish-osu-subtitle/，
     宽高设成和画布一样（例如 1920 x 1080），铺满整个画面。台词和角色那个源读同一份 ../fatfish-osu/state.json。 -->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>TomoPet 字幕</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; user-select: none; }
      #line {
        position: fixed; left: 0; right: 0; bottom: 8%; padding: 0 6%;
        text-align: center; color: #fff; font: 700 40px/1.35 "Microsoft YaHei", "PingFang SC", sans-serif;
        -webkit-text-stroke: 6px rgba(0, 0, 0, .88); paint-order: stroke fill; text-shadow: 0 2px 8px rgba(0, 0, 0, .55);
        opacity: 0; transition: opacity .2s ease; word-break: break-all;
      }
      #line.on { opacity: 1; }
    </style>
  </head>
  <body>
    <div id="line"></div>
    <script>
      (function () {
        'use strict';
        var line = document.getElementById('line');
        var settings = { fontSize: 40, bottom: 8 };
        var lastSeq = null;
        var timer = null;

        function apply() {
          var px = Math.max(12, Math.min(160, Number(settings.fontSize) || 40));
          line.style.fontSize = px + 'px';
          line.style.webkitTextStrokeWidth = Math.max(3, Math.round(px * 0.15)) + 'px';
          line.style.bottom = Math.max(0, Math.min(60, Number(settings.bottom) || 0)) + '%';
        }

        function show(text, durationMs) {
          var given = Number(durationMs) || 0;
          var ms = given > 0 ? Math.max(900, Math.min(60000, given)) : Math.max(1200, Math.min(6000, Array.from(String(text || '')).length * 230));
          line.textContent = text;
          line.classList.add('on');
          clearTimeout(timer);
          timer = setTimeout(function () { line.classList.remove('on'); }, Math.max(2600, ms + 800));
        }

        function poll() {
          fetch('../fatfish-osu/state.json?t=' + Date.now(), { cache: 'no-store' })
            .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
            .then(function (s) {
              if (lastSeq === null) { lastSeq = s.seq; return; } // 刚打开不重放上一句
              if (s.seq !== lastSeq) { lastSeq = s.seq; if (s.text) show(s.text, s.durationMs); }
            })
            .catch(function () {});
        }

        try {
          var folder = location.pathname.replace(/^\/+|\/+$/g, '').replace(/\/index\.html$/, '');
          var ws = new WebSocket('ws://' + location.host + '/websocket/commands');
          ws.onopen = function () { ws.send('getSettings:' + encodeURI(folder)); };
          ws.onmessage = function (event) {
            try {
              var data = JSON.parse(event.data);
              if (data && data.command === 'getSettings' && data.message) {
                if (data.message.fontSize !== undefined) settings.fontSize = Number(data.message.fontSize) || 40;
                if (data.message.bottom !== undefined) settings.bottom = Number(data.message.bottom);
                apply();
              }
            } catch (e) {}
          };
        } catch (e) {}

        apply();
        poll();
        setInterval(poll, 300);
        window.__subtitleShow = show;
        window.__subtitleSettings = settings;
        window.__subtitleApply = apply;
      })();
    </script>
  </body>
</html>
